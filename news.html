<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お知らせ | 柴田屋整形外科</title><style>body{margin:0;background:#f7f5ef;color:#193a34;font-family:"Noto Sans JP",sans-serif}header{padding:22px 6%;border-bottom:1px solid #d9ddd4;display:flex;justify-content:space-between;gap:15px}a{color:inherit}header a{text-decoration:none}main{max-width:1100px;margin:auto;padding:65px 22px}h1{font-size:clamp(34px,6vw,65px);font-weight:500}small{color:#99835c;letter-spacing:.2em}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:35px 0}.filters button{background:transparent;border:1px solid #c7cdc5;padding:10px 15px;color:#193a34;cursor:pointer;border-radius:24px}.filters button.active{background:#193a34;color:white}.shnews-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.shnews-card{background:#fffefa;border:1px solid #d9ddd4;padding:25px;text-decoration:none;display:flex;flex-direction:column;gap:15px;min-height:145px}.shnews-card strong{font-size:21px;font-weight:500}.shnews-meta{font-size:12px;color:#8b7c63}.note{font-size:12px;color:#65746d;margin-top:30px}@media(max-width:650px){.shnews-grid{grid-template-columns:1fr}header{font-size:12px}}</style></head><body><header><a href="index.html">柴田屋整形外科</a><a href="index.html">トップページへ ↗</a></header><main><small>SHIBATAYA NEWS</small><h1>クリニックからのお知らせ。</h1><p>診療案内、体操教室、スタッフ紹介などの情報をお届けします。</p><div class="filters" id="filters"></div><div class="shnews-grid" id="allnews"></div><p class="note">※現在は操作確認用デモです。「掲載例」は実際の告知ではありません。編集内容はこのブラウザにのみ保存されます。</p></main><script src="news-data.js"></script><script>let current='すべて';const cats=['すべて','診療案内','イベント','スタッフ','その他'];function render(){filters.innerHTML=cats.map(x=>`<button class="${current===x?'active':''}" data-cat="${x}">${x}</button>`).join('');let a=SHNews.visible(SHNews.get()).filter(x=>current==='すべて'||x.category===current).sort((a,b)=>Number(!!b.important)-Number(!!a.important));allnews.innerHTML=a.length?a.map(x=>`<article id="${SHNews.safe(x.id)}" class="shnews-card"><span class="shnews-meta">${x.important?'重要 / ':''}${SHNews.safe(x.category)}${x.sample?' · 掲載例':''}</span><strong>${SHNews.safe(x.title)}</strong><span style="line-height:1.9;white-space:pre-wrap">${SHNews.safe(x.body)}</span></article>`).join(''):'<p>該当するお知らせはありません。</p>'}filters.addEventListener('click',e=>{if(e.target.dataset.cat){current=e.target.dataset.cat;render()}});render();</script></body></html>
