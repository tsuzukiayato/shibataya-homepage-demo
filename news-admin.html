<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掲示板編集デモ | 柴田屋整形外科</title><style>body{margin:0;background:#f7f5ef;color:#193a34;font-family:"Noto Sans JP",sans-serif}header{padding:20px 5%;background:#193a34;color:white;display:flex;justify-content:space-between;gap:10px}a{color:inherit}main{max-width:1100px;margin:auto;padding:32px 18px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:#fffefa;border:1px solid #d9ddd4;padding:22px}h1{font-size:30px}label{display:block;font-size:13px;margin:15px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bec8bf;border-radius:4px;background:white;font:inherit;color:#193a34}textarea{min-height:120px}button{border:0;background:#193a34;color:white;padding:12px 17px;cursor:pointer;margin:8px 5px 0 0}button.secondary{background:#e9e9df;color:#193a34}button.danger{background:#8d423e}.item{border-bottom:1px solid #ddd;padding:14px 0}.item button{padding:7px 10px}.preview{white-space:pre-wrap;line-height:1.8;min-height:170px}.note{font-size:12px;color:#65746d;line-height:1.8}.tag{font-size:12px;color:#99835c}.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.dates{grid-template-columns:1fr}header{font-size:12px}}</style></head><body><header><span>SHIBATAYA NEWS / 編集デモ</span><a href="index.html">ホームへ ↗</a></header><main><h1>院内掲示板を編集する。</h1><p class="note">これはローカルデモです。ログイン・公開処理は未実装です。保存しても一般公開されません。</p><div class="layout"><section class="panel"><h2>新しいお知らせ</h2><form id="form"><input type="hidden" id="postid"><label>カテゴリー</label><select id="category"><option>診療案内</option><option>イベント</option><option>スタッフ</option><option>その他</option></select><label>タイトル</label><input id="posttitle" maxlength="100" required placeholder="例：お盆期間の休診について"><label>本文</label><textarea id="postbody" maxlength="3000" required placeholder="内容を入力してください"></textarea><div class="dates"><div><label>掲載開始日（任意）</label><input type="date" id="start"></div><div><label>掲載終了日（任意）</label><input type="date" id="end"></div></div><label><input id="important" type="checkbox" style="width:auto"> 重要なお知らせとして優先表示</label><button type="submit">下書きを保存</button><button type="button" class="secondary" id="reset">新規作成に戻る</button></form></section><section class="panel"><h2>リアルタイムプレビュー</h2><div class="preview" id="preview"></div><hr><h2>保存済みのお知らせ</h2><div id="items"></div><button type="button" class="secondary" id="export">下書きをJSONで書き出す</button><p class="note">この端末・ブラウザに保存されます。ブラウザデータ削除で消える場合があります。別端末やGitHubには同期しません。</p><a href="news.html">お知らせ一覧を確認 ↗</a></section></div></main><script src="news-data.js"></script><script>const $=id=>document.getElementById(id);let posts=SHNews.get();function esc(x){return SHNews.safe(x)}function update(){preview.innerHTML=`<div class="tag">${esc(category.value)}${important.checked?' / 重要':''}</div><h2>${esc(posttitle.value||'タイトルを入力してください')}</h2><div>${esc(postbody.value||'ここに本文が表示されます')}</div><p class="tag">${start.value||'開始日未指定'} ～ ${end.value||'終了日未指定'}</p>`}function list(){items.innerHTML=posts.length?posts.map(x=>`<div class="item"><div class="tag">${esc(x.category)} ${x.sample?'（掲載例）':''}</div><strong>${esc(x.title)}</strong><div><button type="button" data-edit="${esc(x.id)}">編集</button><button type="button" class="danger" data-del="${esc(x.id)}">削除</button></div></div>`).join(''):'<p>保存されたお知らせはありません。</p>'}function clear(){form.reset();postid.value='';update()}form.addEventListener('input',update);form.addEventListener('change',update);form.addEventListener('submit',e=>{e.preventDefault();if(start.value&&end.value&&start.value>end.value){alert('掲載終了日は開始日以降にしてください');return}const id=postid.value||'post-'+Date.now();const p={id,category:category.value,title:posttitle.value.trim(),body:postbody.value.trim(),start:start.value,end:end.value,important:important.checked,sample:false};if(!p.title||!p.body)return;posts=posts.filter(x=>x.id!==id);posts.unshift(p);try{SHNews.save(posts)}catch(e){alert('保存容量が不足しています');return}list();clear();alert('このブラウザに下書きを保存しました（公開はされません）')});items.addEventListener('click',e=>{let id=e.target.dataset.edit||e.target.dataset.del;if(!id)return;let p=posts.find(x=>x.id===id);if(!p)return;if(e.target.dataset.del){if(!confirm('このお知らせを削除しますか？'))return;posts=posts.filter(x=>x.id!==id);SHNews.save(posts);list();return}postid.value=p.id;category.value=p.category;posttitle.value=p.title;postbody.value=p.body;start.value=p.start||'';end.value=p.end||'';important.checked=!!p.important;update();scrollTo({top:0,behavior:'smooth'})});reset.onclick=clear;export.onclick=()=>{const blob=new Blob([JSON.stringify(posts,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='shibataya-news-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};update();list();</script></body></html>
